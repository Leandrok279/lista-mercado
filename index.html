<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1976d2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lista Mercado"><title>Lista de Mercado</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#1976d2;color:white;padding:18px 16px;text-align:center}h1{margin:0;font-size:23px}main{max-width:680px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}label{display:block;font-size:13px;font-weight:700;margin:4px 0 6px}input{width:100%;height:48px;border:1px solid #ccd4dc;border-radius:10px;padding:10px 12px;font-size:17px;background:#fff}.add{width:100%;height:52px;margin-top:12px;border:0;border-radius:11px;background:#1976d2;color:#fff;font-size:17px;font-weight:700}.total{text-align:center;color:#1976d2;font-size:25px;font-weight:800}.item{background:#fafafa;border-left:5px solid #1976d2;border-radius:11px;padding:13px;margin-bottom:11px}.item.done{opacity:.55;border-left-color:#777}.item.done .name{text-decoration:line-through}.name{font-size:18px;font-weight:750;margin-bottom:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subtotal{font-size:17px;font-weight:750;text-align:right;margin-top:10px}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;border:0;border-radius:9px;padding:10px;font-size:14px}.check{background:#dff4e5}.del{background:#ffe3e3}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px}.bottom button{border:0;border-radius:10px;padding:12px;font-weight:700;background:#e8edf2}.danger{background:#ffe0e0!important;color:#a40000}.empty{text-align:center;color:#777;padding:18px}.missing{color:#a66b00;font-weight:400}</style></head><body><header><h1>🛒 Minha Lista de Mercado</h1></header><main><section class="card"><label for="produto">Produto</label><input id="produto" autocomplete="off" placeholder="Ex.: Arroz"><button id="add" class="add" type="button">＋ ADICIONAR PRODUTO</button></section><section class="card"><div class="total">TOTAL: <span id="total">R$ 0,00</span></div></section><section class="card"><div class="bottom"><button id="clearBought" type="button">☑ Limpar comprados</button><button id="clearAll" type="button" class="danger">🗑 Limpar lista</button></div></section><section id="lista" class="card"></section></main><script>const KEY="listaMercadoApp";let itens=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(itens))itens=[];const produto=document.getElementById("produto"),lista=document.getElementById("lista"),totalEl=document.getElementById("total");function save(){localStorage.setItem(KEY,JSON.stringify(itens))}function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function parseMoney(v){v=String(v||"").trim().replace(/R\$/g,"").replace(/\s/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");return parseFloat(v)||0}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function add(){const nome=produto.value.trim();if(!nome){produto.focus();return}itens.push({id:Date.now()+Math.random(),produto:nome,quantidade:null,preco:null,comprado:false});save();render();produto.value="";produto.focus()}function render(){let total=0;if(!itens.length){lista.innerHTML='<div class="empty">Sua lista está vazia.<br>Digite um produto acima.</div>';totalEl.textContent=money(0);return}lista.innerHTML=itens.map(i=>{const q=i.quantidade>0?i.quantidade:null,p=i.preco>0?i.preco:null,sub=p?(q||1)*p:0;total+=sub;return `<article class="item ${i.comprado?'done':''}" data-id="${i.id}"><div class="name">${esc(i.produto)}</div><div class="fields"><div><label>Quantidade</label><input class="q" type="number" min="1" step="1" inputmode="numeric" placeholder="Qtd." value="${q??''}"></div><div><label>Preço/un.</label><input class="p" inputmode="decimal" placeholder="R$ 0,00" value="${p!=null?String(p).replace('.',','):''}"></div></div><div class="subtotal">${p?'Subtotal: '+money(sub):'<span class="missing">Subtotal: informe o preço</span>'}</div><div class="actions"><button class="check" type="button" data-action="check">${i.comprado?'↩ Desmarcar':'☑ Comprado'}</button><button class="del" type="button" data-action="del">🗑 Excluir</button></div></article>`}).join("");totalEl.textContent=money(total)}document.getElementById("add").addEventListener("click",add);produto.addEventListener("keydown",e=>{if(e.key==='Enter'){e.preventDefault();add()}});lista.addEventListener("input",e=>{const item=e.target.closest('.item');if(!item)return;const i=itens.find(x=>String(x.id)===item.dataset.id);if(!i)return;if(e.target.classList.contains('q')){const v=e.target.value.trim();i.quantidade=v?Math.max(1,parseInt(v)||1):null}if(e.target.classList.contains('p')){const v=e.target.value.trim();i.preco=v?parseMoney(v):null}save();const q=i.quantidade>0?i.quantidade:1,p=i.preco>0?i.preco:null;item.querySelector('.subtotal').innerHTML=p?'Subtotal: '+money(q*p):'<span class="missing">Subtotal: informe o preço</span>';let t=0;itens.forEach(x=>{if(x.preco>0)t+=(x.quantidade>0?x.quantidade:1)*x.preco});totalEl.textContent=money(t)});lista.addEventListener("click",e=>{const b=e.target.closest('button[data-action]');if(!b)return;const item=b.closest('.item'),id=item.dataset.id;if(b.dataset.action==='check'){const i=itens.find(x=>String(x.id)===id);if(i)i.comprado=!i.comprado}else itens=itens.filter(x=>String(x.id)!==id);save();render()});document.getElementById('clearBought').addEventListener('click',()=>{itens=itens.filter(i=>!i.comprado);save();render()});document.getElementById('clearAll').addEventListener('click',()=>{if(!itens.length||confirm('Apagar toda a lista?')){itens=[];save();render()}});render();</script></body></html>
