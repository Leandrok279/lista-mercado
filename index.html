<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<title>Minha Lista de Mercado - v7</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f6f9;color:#222;font-family:Arial,sans-serif}
header{background:#1976d2;color:#fff;text-align:center;padding:18px 12px;position:sticky;top:0;z-index:10}
h1{font-size:22px;margin:0}
main{max-width:650px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:13px;font-weight:700;margin:5px 0}
input{display:block;width:100%;height:48px;border:1px solid #ccd4dc;border-radius:10px;padding:10px 12px;font-size:17px;background:#fff}
.add{display:block;width:100%;height:52px;margin-top:12px;border:0;border-radius:10px;background:#1976d2;color:#fff;font-size:17px;font-weight:700}
.total{text-align:center;color:#1976d2;font-size:25px;font-weight:700}
.item{background:#fafafa;border-left:5px solid #1976d2;border-radius:10px;padding:13px;margin-bottom:10px}
.item.done{opacity:.55;border-left-color:#777}
.item.done .name{text-decoration:line-through}
.name{font-size:18px;font-weight:700;margin-bottom:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields input{height:44px}
.subtotal{text-align:right;font-size:17px;font-weight:700;margin-top:9px}
.actions{display:flex;gap:7px;margin-top:10px}
.actions button{flex:1;border:0;border-radius:8px;padding:10px;font-size:14px}
.check{background:#dff4e5}.del{background:#ffe3e3}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bottom button{border:0;border-radius:9px;padding:12px;background:#e8edf2;font-weight:700}
.danger{background:#ffe0e0!important;color:#a40000}
.empty{text-align:center;color:#777;padding:18px}
.missing{color:#a66b00;font-weight:400}
small{font-weight:400;color:#777}
</style>
</head>
<body>
<header><h1>🛒 Minha Lista de Mercado</h1></header>
<main>
<section class="card">
<label for="produto">Produto</label>
<input id="produto" autocomplete="off" placeholder="Ex.: Arroz">
<form id="formAdd" style="margin:0"><button id="add" class="add" type="submit">＋ ADICIONAR PRODUTO</button></form>
<button id="installHelp" type="button" style="width:100%;height:48px;margin-top:10px;border:0;border-radius:10px;background:#e8f0fe;color:#1456a0;font-weight:700;font-size:16px">📱 COLOCAR NA TELA DE INÍCIO</button>
<div id="help" style="display:none;margin-top:10px;padding:12px;border-radius:10px;background:#f3f7fc;font-size:14px;line-height:1.5">
<b>No iPhone:</b><br>
1. Abra esta lista pelo Safari.<br>
2. Toque em <b>Compartilhar</b> (quadrado com seta para cima).<br>
3. Toque em <b>Adicionar à Tela de Início</b>.<br>
4. Toque em <b>Adicionar</b>.<br><br>
O ícone da Lista de Mercado ficará na tela inicial.
</div>
</section>

<section class="card">
<div class="total">TOTAL: <span id="total">R$ 0,00</span></div>
</section>

<section class="card">
<div class="bottom">
<button id="clearBought" type="button">☑ Limpar comprados</button>
<button id="clearAll" type="button" class="danger">🗑 Limpar lista</button>
</div>
</section>

<section id="lista" class="card"></section>
</main>

<script>
(function(){
var KEY="minhaListaMercado4";
var itens=[];
try{itens=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(itens))itens=[];}catch(e){itens=[];}

function salvar(){try{localStorage.setItem(KEY,JSON.stringify(itens));}catch(e){}}
function moeda(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function numero(v){
 v=String(v||"").trim().replace(/R\$/g,"").replace(/\s/g,"");
 if(v.indexOf(",")>=0)v=v.replace(/\./g,"").replace(",",".");
 return parseFloat(v)||0;
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});}

function adicionar(){
 var campo=document.getElementById("produto"),nome=campo.value.trim();
 if(!nome){alert("Digite o nome do produto.");campo.focus();return;}
 itens.push({id:String(Date.now())+Math.random(),produto:nome,quantidade:null,preco:null,comprado:false});
 salvar();render();
 campo.value="";
 try{campo.focus();}catch(e){}
 return false;
}

function render(){
 var lista=document.getElementById("lista"),total=0;
 if(!itens.length){
  lista.innerHTML='<div class="empty">Sua lista está vazia.<br><small>Digite um produto acima.</small></div>';
  document.getElementById("total").textContent=moeda(0);return;
 }
 lista.innerHTML=itens.map(function(i){
  var q=i.quantidade, p=i.preco;
  var temQ=q!==null&&q!==undefined&&q>0, temP=p!==null&&p!==undefined&&p>0;
  var sub=temP?(temQ?q:1)*p:0; total+=sub;
  return '<div class="item '+(i.comprado?'done':'')+'" data-id="'+i.id+'">'+
   '<div class="name">'+esc(i.produto)+'</div>'+
   '<div class="fields">'+
   '<div><label>Quantidade</label><input class="q" type="number" min="1" step="1" inputmode="numeric" placeholder="Qtd." value="'+(temQ?q:"")+'"></div>'+
   '<div><label>Preço/un.</label><input class="p" inputmode="decimal" placeholder="R$ 0,00" value="'+(temP?String(p).replace(".",","):"")+'"></div>'+
   '</div>'+
   '<div class="subtotal">'+(temP?("Subtotal: "+moeda(sub)):'<span class="missing">Subtotal: informe o preço</span>')+'</div>'+
   '<div class="actions"><button class="check" type="button" data-action="check">'+(i.comprado?'↩ Desmarcar':'☑ Comprado')+'</button><button class="del" type="button" data-action="del">🗑 Excluir</button></div>'+
   '</div>';
 }).join("");
 document.getElementById("total").textContent=moeda(total);
}

function atualizar(id){
 var el=document.querySelector('.item[data-id="'+id+'"]');if(!el)return;
 var i=itens.find(function(x){return String(x.id)===String(id);});if(!i)return;
 var q=el.querySelector(".q").value.trim(),p=el.querySelector(".p").value.trim();
 i.quantidade=q===""?null:Math.max(1,parseInt(q,10)||1);
 i.preco=p===""?null:numero(p);
 salvar();render();
 // Reposiciona o cursor no campo que estava sendo editado após a atualização.
}

document.getElementById("formAdd").addEventListener("submit",function(e){
  e.preventDefault();
  adicionar();
});

document.getElementById("installHelp").onclick=function(){
  var x=document.getElementById("help"); x.style.display=x.style.display==="none"?"block":"none";
};

document.getElementById("lista").addEventListener("input",function(e){
 var el=e.target.closest(".item");if(!el)return;
 var i=itens.find(function(x){return String(x.id)===String(el.dataset.id);});if(!i)return;
 if(e.target.classList.contains("q")){
  var q=e.target.value.trim();i.quantidade=q===""?null:Math.max(1,parseInt(q,10)||1);
 }else if(e.target.classList.contains("p")){
  var p=e.target.value.trim();i.preco=p===""?null:numero(p);
 }else return;
 salvar();
 var temQ=i.quantidade!=null&&i.quantidade>0,temP=i.preco!=null&&i.preco>0;
 var sub=temP?(temQ?i.quantidade:1)*i.preco;
 el.querySelector(".subtotal").innerHTML=temP?"Subtotal: "+moeda(sub):'<span class="missing">Subtotal: informe o preço</span>';
 var total=itens.reduce(function(s,x){
  var tq=x.quantidade!=null&&x.quantidade>0,tp=x.preco!=null&&x.preco>0;
  return s+(tp?(tq?x.quantidade:1)*x.preco:0);
 },0);
 document.getElementById("total").textContent=moeda(total);
});

document.getElementById("lista").addEventListener("click",function(e){
 var b=e.target.closest("button[data-action]");if(!b)return;
 var el=b.closest(".item"),id=el.dataset.id;
 if(b.dataset.action==="check"){
  var i=itens.find(function(x){return String(x.id)===String(id);});if(i)i.comprado=!i.comprado;
  salvar();render();
 }else if(b.dataset.action==="del"){
  itens=itens.filter(function(x){return String(x.id)!==String(id);});
  salvar();render();
 }
});

document.getElementById("clearBought").addEventListener("click",function(){
 itens=itens.filter(function(i){return !i.comprado;});salvar();render();
});
document.getElementById("clearAll").addEventListener("click",function(){
 if(itens.length&&!confirm("Apagar toda a lista?"))return;
 itens=[];salvar();render();
});
render();
})();
</script>
</body>
</html>
