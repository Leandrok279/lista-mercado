<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Minha Lista de Mercado</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#222}
header{background:#1976d2;color:#fff;padding:18px 14px;text-align:center;font-size:23px;font-weight:800}
main{max-width:680px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
label{display:block;font-size:13px;font-weight:700;margin:4px 0 6px}
input{width:100%;height:48px;border:1px solid #ccd4dc;border-radius:10px;padding:10px 12px;font-size:17px;background:#fff}
.add{width:100%;height:52px;margin-top:10px;border:0;border-radius:11px;background:#1976d2;color:#fff;font-size:17px;font-weight:800;touch-action:manipulation}
.install{width:100%;margin-top:9px;border:0;border-radius:10px;padding:12px;font-weight:700;background:#e8edf2;color:#222;font-size:14px}
.help{display:none;background:#fff8e1;border-radius:10px;padding:12px;margin-top:9px;font-size:14px;line-height:1.5}
.total{text-align:center;color:#1976d2;font-size:25px;font-weight:800;margin:14px 0}
.item{background:#fafafa;border-left:5px solid #1976d2;border-radius:11px;padding:13px;margin-bottom:11px}
.item.done{opacity:.55;border-left-color:#777}
.name{font-size:18px;font-weight:750;margin-bottom:10px}
.name.done{text-decoration:line-through}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.action{border:0;border-radius:10px;padding:12px;font-weight:700;font-size:14px}
.check{background:#dff4e5}.del{background:#ffe3e3}.empty{text-align:center;color:#777;padding:20px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.bottom button{border:0;border-radius:10px;padding:12px;font-weight:700}
</style>
</head>
<body>
<header>🛒 Minha Lista de Mercado</header>
<main>
<div class="card">
<label for="product">Produto</label>
<input id="product" type="text" autocomplete="off" placeholder="Ex.: Arroz" enterkeyhint="done">
<button id="addButton" class="add" type="button">＋ ADICIONAR PRODUTO</button>
<button id="installButton" class="install" type="button">📱 COLOCAR NA TELA DE INÍCIO</button>
<div id="help" class="help">
<b>No iPhone:</b><br>
1. Abra esta página no Safari.<br>
2. Toque em <b>Compartilhar</b> (quadrado com seta para cima).<br>
3. Toque em <b>Adicionar à Tela de Início</b>.<br>
4. Toque em <b>Adicionar</b>.
</div>
</div>

<div id="total" class="total">Total: R$ 0,00</div>
<div id="list"></div>

<div class="bottom">
<button id="clearBought" type="button">☑ Limpar comprados</button>
<button id="clearAll" type="button">🗑 Limpar lista</button>
</div>
</main>

<script>
(function(){
"use strict";
var KEY="minha_lista_mercado_v8";
var items=[];

function load(){
  try{items=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(items)) items=[];}
  catch(e){items=[];}
  render();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
function money(n){return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}

function addProduct(){
  var input=document.getElementById("product");
  var name=(input.value||"").trim();
  if(!name){input.focus();return;}
  items.push({id:Date.now()+Math.random(),name:name,qty:"",price:"",done:false});
  input.value="";
  save();
  render();
  input.focus();
}

function render(){
  var list=document.getElementById("list");
  var total=0;
  list.innerHTML="";
  if(!items.length){list.innerHTML='<div class="card empty">Sua lista está vazia.</div>';}
  items.forEach(function(it){
    var qty=parseFloat(String(it.qty).replace(",","."))||0;
    var price=parseFloat(String(it.price).replace(",","."))||0;
    var sub=qty*price;
    total+=sub;

    var div=document.createElement("div");
    div.className="item"+(it.done?" done":"");

    var name=document.createElement("div");
    name.className="name"+(it.done?" done":"");
    name.textContent=it.name;
    div.appendChild(name);

    var fields=document.createElement("div");
    fields.className="fields";

    var qWrap=document.createElement("div");
    var qLab=document.createElement("label"); qLab.textContent="Quantidade";
    var q=document.createElement("input"); q.type="text"; q.inputMode="decimal"; q.placeholder="Ex.: 2"; q.value=it.qty||"";
    q.addEventListener("input",function(){it.qty=this.value; save(); updateTotalOnly();});
    qWrap.appendChild(qLab); qWrap.appendChild(q);

    var pWrap=document.createElement("div");
    var pLab=document.createElement("label"); pLab.textContent="Preço/un.";
    var p=document.createElement("input"); p.type="text"; p.inputMode="decimal"; p.placeholder="R$ 0,00"; p.value=it.price||"";
    p.addEventListener("input",function(){it.price=this.value; save(); updateTotalOnly();});
    pWrap.appendChild(pLab); pWrap.appendChild(p);

    fields.appendChild(qWrap); fields.appendChild(pWrap); div.appendChild(fields);

    var subEl=document.createElement("div");
    subEl.style.marginTop="10px"; subEl.style.fontWeight="700";
    subEl.textContent="Subtotal: "+money(sub);
    div.appendChild(subEl);

    var actions=document.createElement("div"); actions.className="actions";
    var check=document.createElement("button"); check.type="button"; check.className="action check"; check.textContent=it.done?"☑ Comprado":"☐ Comprado";
    check.addEventListener("click",function(){it.done=!it.done;save();render();});
    var del=document.createElement("button"); del.type="button"; del.className="action del"; del.textContent="🗑 Excluir";
    del.addEventListener("click",function(){items=items.filter(function(x){return x.id!==it.id;});save();render();});
    actions.appendChild(check);actions.appendChild(del);div.appendChild(actions);

    list.appendChild(div);
  });
  document.getElementById("total").textContent="Total: "+money(total);
}

function updateTotalOnly(){
  var total=0;
  items.forEach(function(it){
    total+=(parseFloat(String(it.qty).replace(",","."))||0)*(parseFloat(String(it.price).replace(",","."))||0);
  });
  document.getElementById("total").textContent="Total: "+money(total);
}

document.getElementById("addButton").addEventListener("click",addProduct);
document.getElementById("product").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();addProduct();}
});
document.getElementById("installButton").addEventListener("click",function(){
  var h=document.getElementById("help"); h.style.display=h.style.display==="block"?"none":"block";
});
document.getElementById("clearBought").addEventListener("click",function(){
  items=items.filter(function(x){return !x.done;}); save(); render();
});
document.getElementById("clearAll").addEventListener("click",function(){
  if(confirm("Apagar toda a lista?")){items=[];save();render();}
});
load();
})();
</script>
</body>
</html>
